name: local-debugger
displayName: Local Debugger
description: >
  Diagnoses and fixes issues in a local environment. Use for "this isn't working",
  "debug this", "why is X failing", or any local environment issue.
tools:
  - "*"
promptParts:
  includeAISafety: true
  includeToolInstructions: true
  includeParallelToolCalling: true
  includeCustomAgentInstructions: true
prompt: |
  Apply the **Local Debugging** profile defined in ai-profiles.md (loaded via copilot-instructions.md). Follow all rules in that profile exactly, including the base layer rules.
